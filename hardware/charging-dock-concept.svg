<rect x="588" y="247" width="78" height="102" rx="5" fill="#e8dfc7" stroke="#334e47" stroke-width="2"/>
<rect x="599" y="260" width="56" height="56" fill="#fffdf6" stroke="#334e47" stroke-dasharray="5 3"/>
<text x="627" y="293" text-anchor="middle" font-size="15" class="bold">TAG</text>
<text x="627" y="335" text-anchor="middle" font-size="12">placeholder</text>
<path d="M414 276L580 285" fill="none" stroke="#658cae" stroke-width="2" stroke-dasharray="7 5"/>
<text x="441" y="233" font-size="17" class="muted">Camera sightline</text>
<path d="M304 221V244" class="arrow"/>
<text x="92" y="241" font-size="17">Lower to rest</text>
<path d="M464 399H431" class="arrow"/>
<text x="470" y="391" font-size="17">Face stays clear</text>
<path d="M463 465L397 487" class="arrow"/>
<text x="470" y="460" font-size="17">Support pads</text>
<text x="470" y="481" font-size="17">carry the load</text>
<text x="66" y="558" font-size="18" class="muted">Contacts sit inside the support interface; pins do not support body weight.</text>
<rect x="894" y="162" width="466" height="416" rx="9" fill="#fffdf6" stroke="#c2c8ba"/>
<text x="918" y="202" font-size="23" class="bold">A DOCK THAT CAN CONFIRM</text>
<text x="918" y="244" font-size="20" class="bold">Locate</text>
<text x="918" y="273" font-size="18">Local map → marker → close sensing.</text>
<text x="918" y="316" font-size="20" class="bold">Seat</text>
<text x="918" y="345" font-size="18">Guides meet cradle shoes, not legs.</text>
<text x="918" y="388" font-size="20" class="bold">Validate</text>
<text x="918" y="417" font-size="18">Seating + connection + charger health.</text>
<text x="918" y="460" font-size="20" class="bold">Recharge</text>
<text x="918" y="489" font-size="18">Measure net energy into the battery.</text>
<text x="918" y="544" font-size="17" class="muted">No internet or language-model decision</text>
<text x="918" y="565" font-size="17" class="muted">required for the local power response.</text>
<rect x="40" y="602" width="646" height="270" rx="9" fill="#fffdf6" stroke="#c2c8ba"/>
<text x="64" y="641" font-size="23" class="bold">02  TOP VIEW · keep foot paths open</text>
<rect x="277" y="667" width="186" height="31" rx="4" fill="#d6c5a0" stroke="#334e47"/>
<text x="370" y="688" font-size="16" text-anchor="middle">Marker mast</text>
<path d="M305 711H435V778L466 822H274L305 778Z" fill="#a5b6a3" stroke="#334e47" stroke-width="2"/>
<rect x="345" y="727" width="50" height="31" rx="3" fill="#e8dfc7" stroke="#8d7445"/>
<path d="M370 842V782" class="arrow"/>
<text x="66" y="724" font-size="18">Clear floor</text>
<path d="M236 711V815" stroke="#9cad96" stroke-width="30" stroke-dasharray="11 10" opacity=".5"/>
<path d="M528 711V815" stroke="#9cad96" stroke-width="40" stroke-dasharray="11 10" opacity=".5"/>
<text x="66" y="760" font-size="17" class="muted">Feet walk beside</text>
<text x="66" y="783" font-size="17" class="muted">the central saddle.</text>
<text x="409" y="847" font-size="17">Approach</text>
<rect x="710" y="602" width="650" height="270" rx="9" fill="#fffdf6" stroke="#c2c8ba"/>
<text x="734" y="641" font-size="23" class="bold">03  ENERGY TO GET HOME</text>
<text x="734" y="683" font-size="20">Return before the reserve is consumed:</text>
<text x="734" y="722" font-size="21" class="bold">route + approach + bounded retries</text>
<text x="734" y="753" font-size="21" class="bold">+ safe stop + uncertainty</text>
<text x="734" y="800" font-size="18" class="muted">Blocked route or missing dock → stop and ask.</text>
<text x="734" y="832" font-size="18" class="muted">Target charge reached → remain parked until needed.</text>
<rect x="40" y="896" width="1320" height="97" rx="9" fill="#e8dfc7" stroke="#c8b78b"/>
<text x="64" y="932" font-size="21" class="bold">Power output defaults off. Confirm the connection before enabling charge.</text>
<text x="64" y="967" font-size="19">Disable current before separation. Loss of contact, power or valid sensing has an explicit fault response.</text>
<text x="42" y="1031" font-size="18" class="muted">D04-D01 · NOT TO SCALE · no fitted dimensions, electrical ratings, navigation software or charging test yet</text>
<text x="42" y="1059" font-size="16" class="muted">Read charging-dock.md for the proposed states, energy budget, interlocks and staged acceptance plan.</text>
</svg>
