<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" style="width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Mack D04: a home station for autonomous recharging</title>
<desc id="desc">Side and top schematics show Mack lowering her structural cradle onto a guided central saddle with protected electrical contacts. A marker guides approach; floor paths remain clear for her feet. Proposed design only, with no selected dimensions or tested docking behavior.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#536e68" stroke-width="1.7"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#243d37}.muted{fill:#536e68}.bold{font-weight:700}.line{fill:none;stroke:#536e68;stroke-width:2}.arrow{fill:none;stroke:#536e68;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1400" height="1080" fill="#f2f0e7"/>
<text x="42" y="47" font-size="18" class="muted">M.A.C. MODEL 04 / POWER + AUTONOMY</text>
<text x="40" y="98" font-size="38" class="bold">D04 — a place for Mack to come home</text>
<text x="42" y="132" font-size="19" class="muted">Lithium-ion primary · guided contact charging · offline return and alignment</text>
<rect x="40" y="162" width="830" height="416" rx="9" fill="#fffdf6" stroke="#c2c8ba"/>
