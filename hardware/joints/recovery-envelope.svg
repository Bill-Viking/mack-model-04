<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" style="width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">Mack R04: recovery in every direction</title>
<desc id="desc">Concept orientation map for forward and backward pitch, sideways roll and mixed contacts. Structural guards protect the curved face. Each arrow is a case to qualify, not a simulated or proven path.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#536e68" stroke-width="1.7"/></marker>
<g id="side">
<rect x="-42" y="-61" width="84" height="106" rx="10" fill="#d6c5a0" stroke="#334e47" stroke-width="2"/>
<path d="M30 -43Q43 -12 30 21" fill="none" stroke="#658cae" stroke-width="7"/>
<circle cx="28" cy="-49" r="3" fill="#334e47"/>
<rect x="-51" y="-70" width="102" height="124" rx="19" fill="none" stroke="#648a73" stroke-width="5"/>
<path d="M-30 47L-39 66L-20 70M24 47L35 66L17 70" fill="none" stroke="#334e47" stroke-width="8" stroke-linecap="round"/>
</g>
<g id="front">
<rect x="-42" y="-61" width="84" height="106" rx="10" fill="#d6c5a0" stroke="#334e47" stroke-width="2"/>
<rect x="-29" y="-43" width="58" height="51" rx="7" fill="#b2c7da" stroke="#334e47" stroke-width="2"/>
<path d="M-14 -25v9M14 -25v9M-10 -5Q0 2 10 -5" fill="none" stroke="#334e47" stroke-width="3"/>
<rect x="-51" y="-70" width="102" height="124" rx="19" fill="none" stroke="#648a73" stroke-width="5"/>
<path d="M-30 47L-49 66L-30 72M30 47L49 66L30 72" fill="none" stroke="#334e47" stroke-width="8" stroke-linecap="round"/>
</g>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#243d37}.muted{fill:#536e68}.bold{font-weight:700}.arrow{fill:none;stroke:#536e68;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}</style>
<rect width="1400" height="1040" fill="#f2f0e7"/>
<text x="42" y="47" font-size="18" class="muted">M.A.C. MODEL 04 / MECHANICAL DEVELOPMENT</text>
<text x="40" y="98" font-size="38" class="bold">R04 — getting upright from every direction</text>
<text x="42" y="132" font-size="19" class="muted">Proposed coverage · no whole-body simulation or physical recovery test yet</text>
<rect x="40" y="162" width="1320" height="338" rx="9" fill="#fffdf6" stroke="#c2c8ba"/>
<text x="64" y="202" font-size="24" class="bold">01  FORWARD AND BACKWARD · pitch about body Y</text>
<text x="64" y="233" font-size="18" class="muted">Side views. Read in either direction; every reverse path needs separate evidence.</text>
<use href="#side" transform="translate(160 330) rotate(0)"/>
<text x="160" y="441" text-anchor="middle" font-size="19" class="bold">Feet / crouch</text>
<use href="#side" transform="translate(430 330) rotate(90)"/>
<text x="430" y="441" text-anchor="middle" font-size="19" class="bold">Front guard</text>
<use href="#side" transform="translate(700 330) rotate(180)"/>
<text x="700" y="441" text-anchor="middle" font-size="19" class="bold">Roof</text>
<use href="#side" transform="translate(970 330) rotate(270)"/>
<text x="970" y="441" text-anchor="middle" font-size="19" class="bold">Rear guard</text>
<use href="#side" transform="translate(1240 330) rotate(360)"/>
<text x="1240" y="441" text-anchor="middle" font-size="19" class="bold">Feet / crouch</text>
<path d="M255 328H335" class="arrow"/>
<path d="M525 328H605" class="arrow"/>
<path d="M795 328H875" class="arrow"/>
<path d="M1065 328H1145" class="arrow"/>
<text x="64" y="478" font-size="17" class="muted">Orientation map only. The front-to-roof-to-rear route is a candidate, not the required route for every recovery.</text>
<rect x="40" y="524" width="644" height="305" rx="9" fill="#fffdf6" stroke="#c2c8ba"/>
<text x="64" y="564" font-size="23" class="bold">02  SIDEWAYS · roll about body X</text>
<use href="#front" transform="translate(160 673) rotate(90) scale(.8)"/>
<text x="160" y="767" text-anchor="middle" font-size="18">One side</text>
<use href="#front" transform="translate(360 673) rotate(180) scale(.8)"/>
<text x="360" y="767" text-anchor="middle" font-size="18">Roof</text>
<use href="#front" transform="translate(560 673) rotate(270) scale(.8)"/>
<text x="560" y="767" text-anchor="middle" font-size="18">Other side</text>
<path d="M235 672H285" class="arrow"/>
<path d="M435 672H485" class="arrow"/>
<text x="64" y="806" font-size="17" class="muted">Then establish foot contact, crouch and verify stable standing.</text>
<rect x="708" y="524" width="652" height="305" rx="9" fill="#fffdf6" stroke="#c2c8ba"/>
<text x="732" y="564" font-size="23" class="bold">03  CORNERS AND FACE PROTECTION</text>
<path d="M736 599H771" stroke="#648a73" stroke-width="6"/>
<text x="786" y="605" font-size="19" class="bold">Green = structural guard envelope</text>
<text x="732" y="643" font-size="19">Front + roof + rear + sides + corner transitions.</text>
<text x="732" y="675" font-size="19">Curved cover and camera window remain inside it.</text>
<text x="732" y="707" font-size="19">Check diagonal contact, flex, pad squash and cables.</text>
<text x="732" y="747" font-size="18" class="muted">Guards carry loads into the cradle, not the clock skin.</text>
<text x="732" y="779" font-size="18" class="muted">Shape, clearances and contact forces are still to be solved.</text>
<rect x="40" y="853" width="1320" height="105" rx="9" fill="#e8dfc7" stroke="#c8b78b"/>
<text x="64" y="891" font-size="22" class="bold">DESIGN CHANGE: the original sideways arm does not establish fore/aft recovery.</text>
<text x="64" y="927" font-size="19">12 leg axes remain the baseline. Compare leg reach, transverse paddles and a two-axis arm; added axes are TBD.</text>
<text x="42" y="994" font-size="18" class="muted">A 360° protective check is not a qualified 360° rolling skill. Accidental tumble loads require separate tests.</text>
<text x="42" y="1022" font-size="16" class="muted">R04-D01 · NOT TO SCALE · read recovery-envelope.md for the directed test matrix and open engineering work</text>
</svg>
