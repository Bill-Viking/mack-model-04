<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
<title id="title">Mack F04 — a curved face with concealed cameras</title>
<desc id="desc">An engineering schematic showing a flat colour screen behind a convex clear cover, camera windows hidden in a dark border, and the separate option of a folded display with a beamsplitter. Example geometry only.</desc>
<defs>
  <marker id="scene-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b47733"/></marker>
  <marker id="display-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#447e94"/></marker>
  <linearGradient id="glass" x1="0" x2="1"><stop stop-color="#d7edf0" stop-opacity=".8"/><stop offset="1" stop-color="#afcdd4" stop-opacity=".35"/></linearGradient>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#283c45}
    .title{font-size:32px;font-weight:600;letter-spacing:-.6px}.sub{font-size:17px;fill:#637375}
    .label{font-size:18px;font-weight:600}.body{font-size:16px}.small{font-size:14px;fill:#637375}
    .plate{font:12px ui-monospace,monospace;letter-spacing:1.6px;fill:#637375}.card{fill:#faf9f3;stroke:#d3d7cb}
    .leader{fill:none;stroke:#7a8e91;stroke-width:1.5}.scene{fill:none;stroke:#b47733;stroke-width:3;marker-end:url(#scene-arrow)}
    .display{fill:none;stroke:#447e94;stroke-width:3;marker-end:url(#display-arrow)}
  </style>
</defs>
<rect width="1400" height="980" fill="#f3f1e7"/>
<text x="32" y="35" class="plate">M.A.C. MODEL 04 / F04 FACE AND VISION STUDY</text>
<text x="32" y="80" class="title">A curved Mac face. Cameras within the enclosure.</text>
<text x="32" y="112" class="sub">Separate the optical cover, the display and the camera sightline.</text>
<rect x="32" y="145" width="586" height="545" rx="8" class="card"/>
<text x="56" y="179" class="label">A / Proposed first optical fixture</text>
<text x="56" y="205" class="small">Front view · cameras concealed in the dark surround</text>
<rect x="79" y="232" width="492" height="366" rx="35" fill="#d6c4a4" stroke="#b2a38a" stroke-width="2"/>
<rect x="107" y="255" width="436" height="316" rx="26" fill="#272f31"/>
<rect x="149" y="302" width="352" height="244" rx="10" fill="#8998c1"/>
<path d="M159 302H491Q501 302 501 312V323H149V312Q149 302 159 302" fill="#e9e9e0"/>
<text x="163" y="318" font-size="12">File　Edit　View　Special</text>
<rect x="218" y="374" width="215" height="106" fill="#e9e9df" stroke="#333d48" stroke-width="2"/>
<path d="M223 380H428M223 384H428M223 388H428" stroke="#919b9d"/>
<text x="242" y="424" font-size="18">Hello, Bill.</text>
<rect x="339" y="443" width="72" height="23" fill="#f7f6ee" stroke="#333d48"/>
<text x="353" y="459" font-size="12">Hello</text>
<circle cx="171" cy="279" r="10" fill="none" stroke="#c49350" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="479" cy="279" r="10" fill="none" stroke="#c49350" stroke-width="2" stroke-dasharray="3 3"/>
<path d="M126 289Q319 241 523 289" fill="none" stroke="#fff" stroke-opacity=".23" stroke-width="3"/>
<path d="M171 269V238M479 269V238" class="leader"/>
<text x="56" y="631" class="body">Dashed circles are an engineering overlay.</text>
<text x="56" y="655" class="small">One camera first; a second is conditional. Concealment needs a test.</text>

<rect x="638" y="145" width="730" height="545" rx="8" class="card"/>
<text x="662" y="179" class="label">A / Section through the camera and display</text>
<text x="662" y="205" class="small">Camera is behind the common cover, outside the active pixels.</text>
<text x="681" y="242" class="plate">OUTSIDE</text><text x="1061" y="242" class="plate">INSIDE MACK</text>
<path d="M855 258Q786 427 855 590L865 590Q796 427 865 258Z" fill="url(#glass)" stroke="#7799a0" stroke-width="2"/>
<path d="M849 278Q838 307 832 331" fill="none" stroke="#505c5f" stroke-width="9" opacity=".7"/>
<rect x="957" y="288" width="38" height="35" rx="4" fill="#485b58"/>
<rect x="941" y="295" width="16" height="20" rx="3" fill="#354752"/>
<path d="M874 283H1007V330H874" fill="none" stroke="#4f5e60" stroke-width="5"/>
<path d="M690 305H936" class="scene"/>
<text x="680" y="287" class="small">Scene light →</text>
<path d="M985 305H1060" class="leader"/>
<text x="1072" y="310" class="body">Camera</text>
<path d="M1007 330H1060V356" class="leader"/>
<text x="1072" y="362" class="body">Light baffle</text>
<rect x="912" y="371" width="19" height="194" fill="#3f4d57" stroke="#283c45"/>
<rect x="905" y="371" width="7" height="194" fill="#8998c1"/>
<path d="M900 438H701" class="display"/>
<text x="680" y="467" class="small">← Display light</text>
<path d="M931 470H1060" class="leader"/>
<text x="1072" y="475" class="body">Flat colour panel</text>
<path d="M853 580H1060" class="leader"/>
<text x="1072" y="585" class="body">Curved clear cover</text>
<text x="662" y="632" class="body">The dark camera window must transmit useful light.</text>
<text x="662" y="656" class="small">Opaque paint or the LCD backlight would block the camera.</text>

<rect x="32" y="712" width="845" height="218" rx="8" class="card"/>
<text x="56" y="748" class="label">B / To put the camera behind the apparent image</text>
<path d="M201 774L313 886" stroke="#7ba0aa" stroke-width="7"/>
<path d="M81 829H362" class="scene"/>
<rect x="368" y="813" width="37" height="30" rx="4" fill="#485b58"/>
<rect x="357" y="818" width="11" height="20" rx="2" fill="#354752"/>
<rect x="207" y="890" width="101" height="10" fill="#8998c1" stroke="#283c45"/>
<path d="M257 886V829H81" class="display"/>
<text x="78" y="802" class="small">Outside</text>
<text x="421" y="795" class="body">An angled beamsplitter reflects an off-axis</text>
<text x="421" y="819" class="body">display and transmits the camera's view.</text>
<text x="421" y="855" class="small">Requires extra room and a measured light budget.</text>
<text x="421" y="879" class="small">The camera does not look through an ordinary LCD.</text>

<rect x="897" y="712" width="471" height="218" rx="8" class="card"/>
<text x="921" y="748" class="label">C / True under-display camera</text>
<text x="921" y="789" class="body">Special transmitting OLED pixel region,</text>
<text x="921" y="815" class="body">matched camera and image correction.</text>
<text x="921" y="853" class="small">Technology exists. A suitable small module</text>
<text x="921" y="877" class="small">and driver have not been established for Mack.</text>
<text x="32" y="959" class="plate">SCHEMATIC ONLY · NOT TO SCALE · NO OPTICAL TEST OR FIT CLAIM · F04-D01 / 2026-10-21</text>
</svg>
